name: Publish test release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($version -notmatch '-(alpha|beta|rc)(\.|$)') { throw "Only test/pre-release versions may be published" }
          $expected = "v$version"
          if ("${{ github.ref_name }}" -ne $expected) { throw "Tag must be $expected" }
      - name: Build and test release artifacts
        run: npm run dist -- --publish never
      - name: Verify resource reload and packaged resource protocol
        run: npm run qa:resource && npm run qa:packaged
      - name: Upload and publish GitHub pre-release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = Get-ChildItem release -File | Where-Object {
            $_.Name -eq 'latest.yml' -or
            $_.Name -like '*-Setup-*.exe' -or
            $_.Name -like '*-Setup-*.exe.blockmap' -or
            $_.Name -like '*-Portable-*.exe'
          } | ForEach-Object { $_.FullName }
          if ($assets.Count -lt 4) { throw "Release artifacts are incomplete" }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --prerelease --title $tag --notes-file release-notes.md
          }
          gh release upload $tag @assets --clobber
          gh release edit $tag --draft=false --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
