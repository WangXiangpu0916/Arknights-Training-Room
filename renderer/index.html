<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://raw.githubusercontent.com; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>训练室</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <nav>
        <button class="nav active" data-page="dashboard"><span>◈</span>专精规划</button>
        <button class="nav" data-page="operators"><span>◇</span>干员</button>
        <button class="nav" data-page="inventory"><span>▦</span>仓库</button>
        <button class="nav" data-page="settings"><span>⚙</span>设置</button>
      </nav>
      <div class="sidebar-status" id="sidebar-status"></div>
    </aside>
    <main>
      <header class="topbar">
        <div>
          <h1 id="page-title">当前可以专精</h1>
          <p id="page-subtitle">基于真实仓库与加工站配方的确定性计算</p>
        </div>
        <div class="top-actions">
          <button id="refresh-button" class="primary">刷新账号数据</button>
          <span id="sync-badge" class="sync-status">正在读取本地数据</span>
        </div>
      </header>
      <section id="content" class="content"><div class="loading">正在载入……</div></section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel">
      <button class="modal-close" data-close-modal aria-label="关闭">×</button>
      <div id="modal-content"></div>
    </div>
  </div>
  <script src="operator-filter.js"></script>
  <script src="app.js"></script>
</body>
</html>
